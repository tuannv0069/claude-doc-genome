name: genome-checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/sync-version.mjs check
      - run: node scripts/doc-lint.mjs --bundle
      - run: node --test scripts/test-deployment.mjs
      - name: Check bundled tool behavior
        run: node scripts/test-bundle-tools.mjs
